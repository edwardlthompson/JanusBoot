name: CodeQL

# Matrix covers primary stacks (JS/TS, Python, Android). Optional examples/rust and
# examples/go are excluded — see modules/rust/MODULE.md and modules/go/MODULE.md.
# Android java-kotlin is omitted when examples/android was pruned.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Do not add jobs.<id>.environment — Environments block Release Please bot PRs
# (ACTION_REQUIRED) and stall auto-merge. github-pages is Pages-only.

jobs:
  matrix-prep:
    name: Detect CodeQL languages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Emit matrix JSON
        id: emit
        run: |
          set -euo pipefail
          if [ -f examples/android/gradlew ]; then
            MATRIX='{"include":[{"language":"javascript-typescript"},{"language":"python"},{"language":"java-kotlin","paths":"examples/android"}]}'
          else
            MATRIX='{"include":[{"language":"javascript-typescript"},{"language":"python"}]}'
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "CodeQL matrix: ${MATRIX}"

  analyze:
    name: Analyze
    needs: matrix-prep
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      # Default java-kotlin queries cover Android; Compose Navigation deep-link /
      # NavController misuse stays mostly manual until a dedicated query pack —
      # see docs/SECURITY_TRIAGE.md § CodeQL Compose navigation.
      - uses: github/codeql-action/analyze@v4
