[project]
name = "janusbootctl"
version = "0.1.0"
description = "JanusBoot ESP settings CLI — validate, get/set, backup, generate Limine conf"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23.0",
    "pillow>=10.0.0",
]

[project.scripts]
janusbootctl = "janusbootctl.cli:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=1.13.0",
    "pip-licenses>=4.5.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
    "pyright>=1.1.414",
    "types-jsonschema>=4.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janusbootctl", "src/hello"]

[tool.hatch.build.targets.sdist]
include = ["src/janusbootctl", "src/hello", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --cov=janusbootctl --cov=hello --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["janusbootctl", "hello"]
omit = ["*/janusbootctl/__main__.py", "*/janusbootctl/gui_tk.py"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
